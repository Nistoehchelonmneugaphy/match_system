[package]
name = "match_client"
version = "0.1.0"
edition = "2024"


[dependencies]
lightyear = { workspace = true, features = [
    "client", "interpolation", "prediction", "replication", "std", "avian3d", "deterministic","netcode", "lightyear_aeronet", "websocket",
]}
console_error_panic_hook = "0.1.7"
web-time = "1.1.0"
# Direct feature shims for transitive crates that still span multiple getrandom versions.
getrandom = { version = "0.3", features = [
  "wasm_js", # feature 'js' is required for wasm, see https://github.com/rust-random/getrandom?tab=readme-ov-file#webassembly-support
] }
getrandom_02 = { version = "0.2", features = ["js"], package = "getrandom" }
getrandom_04 = { version = "0.4", features = [
  "wasm_js",
], package = "getrandom" }
avian3d = { version = "0.7.0", 
  features=["3d",
  "f32",
  "parry-f32",
  "parallel",
  "serialize"] }
  bevy = { workspace = true }