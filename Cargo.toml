[workspace]
resolver = "3"
members = ["workspace_crates/*"]


[profile.dev]
strip = "symbols"
opt-level = 1
debug = false

[workspace.dependencies]
http = "1.4.2"
url = "2.5.8"
tokio = { version = "1.53.1", features = [ "full" ] }
tokio-tungstenite = { version = "0.30.0", features = [ "rustls-tls-webpki-roots" ] }
futures-util = { version = "0.3.33", features = ["sink"]}
clap = {version = "4.6.4", features = ["derive", "debug"]}
anyhow = "1.0.104"
game_server_structs = { git = "ssh://git@github.com/Aeroel/game_server.git" }
match_server = { path = "workspace_crates/match_server" }
lightyear = { version = "0.28.0", default-features = false }
bevy = { version = "0.19.0", features = [
   "debug", "serialize"
    ] }
serde = { version = "1.0.229", features = ["derive"]}
serde_json = "1.0.151"
dotenvy = "0.15.7"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
rand = "0.10.2"
