[workspace]
resolver = "3"
members = ["workspace_crates/*"]


[profile.dev]
strip = "symbols"
opt-level = 1
debug = false

[workspace.dependencies]
anyhow = "1.0.102"
game_server_structs = { git = "ssh://git@github.com/Aeroel/game_server.git" }
server = { path = "workspace_crates/server" }
avian3d = { version = "=0.7.0", features = ["enhanced-determinism", "serialize"]}
lightyear = { version = "=0.26.4", features = ["deterministic", "websocket", "lightyear_aeronet", "leafwing"]}
leafwing-input-manager = {version="0.20.0", }
bevy = { version = "0.18", features = [
   "debug", "serialize"
    ] }
serde = { version = "1.0.228", features = ["derive"]}
serde_json = "1.0.150"
dotenvy = "0.15.7"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
rand = "0.10.1"
